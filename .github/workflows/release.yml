name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (.NET Framework 4.8)
        run: dotnet build SebLauncher.csproj -c Release -o publish

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/SebLauncher.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SebLauncher.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SebLauncher
          path: |
            publish/SebLauncher.exe
            SebLauncher.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/SebLauncher.exe
            SebLauncher.zip
          generate_release_notes: true
